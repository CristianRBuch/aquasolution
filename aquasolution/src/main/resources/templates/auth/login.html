<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqua Solution - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --azul-principal: #1e4d8c; --azul-oscuro: #1a3d6e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: flex; font-family: 'Segoe UI', sans-serif; }

    .panel-izquierdo {
        width: 55%;
        background: linear-gradient(160deg, var(--azul-oscuro) 0%, var(--azul-principal) 60%, #2563b0 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 50px;
        position: relative;
        overflow: hidden;
    }
    .panel-izquierdo::before {
        content: '';
        position: absolute;
        top: -80px; right: -80px;
        width: 300px; height: 300px;
        background: rgba(255,255,255,0.05);
        border-radius: 50%;
    }
    .panel-izquierdo::after {
        content: '';
        position: absolute;
        bottom: -100px; left: -60px;
        width: 350px; height: 350px;
        background: rgba(255,255,255,0.05);
        border-radius: 50%;
    }
    .panel-izquierdo .logo-img {
        max-width: 260px;
        margin-bottom: 25px;
        filter: brightness(0) invert(1);
        position: relative; z-index: 1;
    }
    .separador {
        width: 60px; height: 3px;
        background: rgba(255,255,255,0.4);
        border-radius: 3px;
        margin-bottom: 20px;
        position: relative; z-index: 1;
    }
    .tagline {
        color: rgba(255,255,255,0.85);
        font-size: 0.95rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 0;
        position: relative; z-index: 1;
    }
    .panel-derecho {
        width: 45%;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 50px;
    }
    .form-box { width: 100%; max-width: 380px; }
    .form-box h2 { font-size: 1.7rem; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .form-box .subtitulo { color: #6b7280; margin-bottom: 35px; font-size: 0.95rem; }
    .form-label { font-weight: 600; color: #374151; font-size: 0.9rem; margin-bottom: 6px; }
    .input-group-text {
        background: white;
        border: 2px solid #e5e7eb;
        border-right: none;
        border-radius: 10px 0 0 10px;
        color: #9ca3af;
    }
    .form-control {
        border: 2px solid #e5e7eb;
        border-left: none;
        border-radius: 0 10px 10px 0;
        padding: 12px 15px;
        font-size: 0.95rem;
        background: white;
        transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--azul-principal); box-shadow: none; }
    .input-group:focus-within .input-group-text { border-color: var(--azul-principal); }
    .btn-login {
        background: linear-gradient(135deg, var(--azul-principal), var(--azul-oscuro));
        border: none;
        border-radius: 10px;
        padding: 13px;
        font-weight: 600;
        font-size: 1rem;
        letter-spacing: 0.5px;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(30, 77, 140, 0.3);
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30, 77, 140, 0.4); opacity: 0.95; }
    .divider {
        display: flex; align-items: center; gap: 12px;
        margin: 20px 0; color: #9ca3af; font-size: 0.85rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
    .link-registro {
        display: block; text-align: center;
        color: var(--azul-principal); font-weight: 600;
        text-decoration: none; font-size: 0.95rem;
        padding: 11px;
        border: 2px solid var(--azul-principal);
        border-radius: 10px;
        transition: all 0.3s;
    }
    .link-registro:hover { background: var(--azul-principal); color: white; }
    .copyright { margin-top: 40px; color: #9ca3af; font-size: 0.8rem; text-align: center; }

    @media (max-width: 768px) {
        .panel-izquierdo { display: none; }
        .panel-derecho { width: 100%; padding: 40px 25px; }
    }
  </style>
</head>
<body>

<div class="panel-izquierdo">
  <img th:src="@{/img/logo_blanco.png}" alt="Aqua Solution" class="logo-img">
  <div class="separador"></div>
  <p class="tagline">Sistema de Gestión Integral</p>
</div>

<div class="panel-derecho">
  <div class="form-box">
    <h2>Bienvenido</h2>
    <p class="subtitulo">Inicia sesión para continuar al sistema</p>

    <div th:if="${param.error}" class="alert alert-danger rounded-3 mb-4" style="font-size:0.9rem;">
      <i class="fas fa-exclamation-circle me-2"></i>Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-success rounded-3 mb-4" style="font-size:0.9rem;">
      <i class="fas fa-check-circle me-2"></i>Sesión cerrada correctamente.
    </div>
    <div th:if="${param.registered}" class="alert alert-success rounded-3 mb-4" style="font-size:0.9rem;">
      <i class="fas fa-check-circle me-2"></i>Registro exitoso. Ya puedes iniciar sesión.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Ingresa tu usuario" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="Ingresa tu contraseña" required>
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100 text-white mb-3">
        <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
      </button>
      <div class="text-center mb-2">
        <a th:href="@{/recuperar}" style="color: #6b7280; font-size: 0.85rem; text-decoration: none;">
          <i class="fas fa-key me-1"></i>¿Olvidaste tu contraseña?
        </a>
      </div>
    </form>

    <div class="divider">o</div>
    <a th:href="@{/registro}" class="link-registro">
      <i class="fas fa-user-plus me-2"></i>Crear una cuenta nueva
    </a>
    <p class="copyright">© 2026 Aqua Solution. Todos los derechos reservados.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
