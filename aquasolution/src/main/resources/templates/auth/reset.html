<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Solution - Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --azul-principal: #1e4d8c; --azul-oscuro: #1a3d6e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; font-family: 'Segoe UI', sans-serif; }
        .panel-izquierdo {
            width: 55%;
            background: linear-gradient(160deg, var(--azul-oscuro) 0%, var(--azul-principal) 60%, #2563b0 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 50px; position: relative; overflow: hidden;
        }
        .panel-izquierdo::before {
            content: ''; position: absolute; top: -80px; right: -80px;
            width: 300px; height: 300px; background: rgba(255,255,255,0.05); border-radius: 50%;
        }
        .panel-izquierdo::after {
            content: ''; position: absolute; bottom: -100px; left: -60px;
            width: 350px; height: 350px; background: rgba(255,255,255,0.05); border-radius: 50%;
        }
        .panel-izquierdo .logo-img {
            max-width: 260px; margin-bottom: 25px;
            filter: brightness(0) invert(1); position: relative; z-index: 1;
        }
        .separador {
            width: 60px; height: 3px; background: rgba(255,255,255,0.4);
            border-radius: 3px; margin-bottom: 20px; position: relative; z-index: 1;
        }
        .tagline {
            color: rgba(255,255,255,0.85); font-size: 0.95rem;
            letter-spacing: 2px; text-transform: uppercase;
            margin-bottom: 0; position: relative; z-index: 1;
        }
        .panel-derecho {
            width: 45%; background: #f8fafc;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 50px;
        }
        .form-box { width: 100%; max-width: 380px; }
        .form-box h2 { font-size: 1.7rem; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
        .form-box .subtitulo { color: #6b7280; margin-bottom: 35px; font-size: 0.9rem; }
        .form-label { font-weight: 600; color: #374151; font-size: 0.9rem; margin-bottom: 6px; }
        .input-group-text {
            background: white; border: 2px solid #e5e7eb; border-right: none;
            border-radius: 10px 0 0 10px; color: #9ca3af;
        }
        .form-control {
            border: 2px solid #e5e7eb; border-left: none;
            border-radius: 0 10px 10px 0; padding: 12px 15px;
            font-size: 0.95rem; background: white; transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--azul-principal); box-shadow: none; }
        .input-group:focus-within .input-group-text { border-color: var(--azul-principal); }
        .btn-primary-custom {
            background: linear-gradient(135deg, var(--azul-principal), var(--azul-oscuro));
            border: none; border-radius: 10px; padding: 13px;
            font-weight: 600; font-size: 1rem; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(30, 77, 140, 0.3);
        }
        .btn-primary-custom:hover { transform: translateY(-2px); opacity: 0.95; }
        .password-strength {
            height: 4px; border-radius: 2px; margin-top: 6px;
            transition: all 0.3s; background: #e9ecef;
        }
        .copyright { margin-top: 40px; color: #9ca3af; font-size: 0.8rem; text-align: center; }
        @media (max-width: 768px) {
            .panel-izquierdo { display: none; }
            .panel-derecho { width: 100%; padding: 40px 25px; }
        }
    </style>
</head>
<body>

<div class="panel-izquierdo">
    <img th:src="@{/img/logo_blanco.png}" alt="Aqua Solution" class="logo-img">
    <div class="separador"></div>
    <p class="tagline">Sistema de Gestión Integral</p>
</div>

<div class="panel-derecho">
    <div class="form-box">
        <h2>Nueva Contraseña</h2>
        <p class="subtitulo">Ingresa tu nueva contraseña. Debe tener mínimo 6 caracteres.</p>

        <div th:if="${error}" class="alert alert-danger rounded-3 mb-4" style="font-size:0.9rem;">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
        </div>

        <form th:action="@{/recuperar/reset}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="mb-3">
                <label class="form-label">Nueva Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" id="password" class="form-control"
                           placeholder="Mínimo 6 caracteres" required minlength="6"
                           oninput="verificarFuerza(this.value)">
                </div>
                <div class="password-strength" id="strengthBar"></div>
                <small id="strengthText" class="text-muted"></small>
            </div>
            <div class="mb-4">
                <label class="form-label">Confirmar Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="confirmar" id="confirmar" class="form-control"
                           placeholder="Repite tu contraseña" required>
                </div>
                <small id="matchText" class="text-muted"></small>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 text-white">
                <i class="fas fa-save me-2"></i>Guardar Nueva Contraseña
            </button>
        </form>

        <p class="copyright">© 2026 Aqua Solution. Todos los derechos reservados.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function verificarFuerza(password) {
        const bar = document.getElementById('strengthBar');
        const text = document.getElementById('strengthText');
        let fuerza = 0;
        if (password.length >= 6) fuerza++;
        if (password.length >= 10) fuerza++;
        if (/[A-Z]/.test(password)) fuerza++;
        if (/[0-9]/.test(password)) fuerza++;
        if (/[^A-Za-z0-9]/.test(password)) fuerza++;
        const colores = ['#dc3545', '#fd7e14', '#ffc107', '#28a745', '#1e4d8c'];
        const textos = ['Muy débil', 'Débil', 'Regular', 'Fuerte', 'Muy fuerte'];
        const porcentajes = ['20%', '40%', '60%', '80%', '100%'];
        bar.style.backgroundColor = fuerza > 0 ? colores[fuerza-1] : '#e9ecef';
        bar.style.width = fuerza > 0 ? porcentajes[fuerza-1] : '0%';
        text.textContent = fuerza > 0 ? textos[fuerza-1] : '';
        text.style.color = fuerza > 0 ? colores[fuerza-1] : '#6c757d';
    }

    document.getElementById('confirmar').addEventListener('input', function() {
        const pass = document.getElementById('password').value;
        const text = document.getElementById('matchText');
        if (this.value === pass) {
            text.textContent = '✓ Las contraseñas coinciden';
            text.style.color = '#28a745';
        } else {
            text.textContent = '✗ Las contraseñas no coinciden';
            text.style.color = '#dc3545';
        }
    });
</script>
</body>
</html>
