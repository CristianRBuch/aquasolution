<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aqua Solution - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --azul-principal: #1e4d8c; --azul-oscuro: #1a3d6e; }
        body { background-color: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-card { border-radius: 20px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        .error-icon { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
    </style>
</head>
<body>
<div class="card error-card p-5 text-center">
    <div class="error-icon bg-danger bg-opacity-10 mb-4">
        <i class="fas fa-exclamation-triangle fa-2x text-danger"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">Acceso Denegado</h3>
    <p class="text-muted mb-4">No tienes permisos para acceder a esta sección del sistema.</p>
    <div class="d-flex gap-3 justify-content-center">
        <a href="/dashboard" class="btn btn-primary rounded-3">
            <i class="fas fa-home me-2"></i>Ir al Dashboard
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-3">
            <i class="fas fa-arrow-left me-2"></i>Volver
        </a>
    </div>
    <small class="text-muted mt-4 d-block">
        <img src="/img/logo_blanco.png" style="filter: invert(1); height: 30px;" alt="Aqua Solution">
    </small>
</div>
</body>
</html>
